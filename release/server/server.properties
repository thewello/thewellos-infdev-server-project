# TheWello's Infdev Server settings. Restart the server after changing them.

# Network
server-port=25565
server-ip=
motd=&eA TheWello's Infdev server
max-players=20
upnp=true
online-mode=true
white-list=false

# World
level-name=world
level-seed=
view-distance=6
spawn-protection=0
# A world taken over from an older build keeps its old land as it is (false), or its chunks get the features that the newer build's populate step makes: ores, trees, and the caves of inf-20100325-1640 (true)
upgrade-old-terrain=false
# When every chunk of an older build's world has been taken over (by play or by /convertworld) the old world's folder is deleted (true) or kept (false)
delete-old-world=true

# Gameplay (difficulty, monsters and animals do not exist in inf-20100227-1433, inf-20100313, inf-20100316, inf-20100320, inf-20100321, inf-20100325-1640, inf-20100327, inf-20100330-1611, inf-20100413-1953, inf-20100414, inf-20100415, inf-20100420, inf-20100607 and inf-20100608)
pvp=true
difficulty=2
spawn-monsters=true
spawn-animals=true
mob-cap-monsters=100
mob-cap-animals=20

# Saving
autosave-minutes=5

# Game version this server runs (put the matching original jar in this folder):
#   inf-20100630-1340, inf-20100227-1433, inf-20100313, inf-20100316, inf-20100320, inf-20100321, inf-20100325-1640, inf-20100327, inf-20100330-1611, inf-20100413-1953, inf-20100414, inf-20100415, inf-20100420, inf-20100607   or   inf-20100608
game-version=inf-20100630-1340

# Game code jar (auto = the inf-*.jar in this folder that belongs to game-version)
game-jar=auto
