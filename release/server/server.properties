# TheWello's Infdev Server settings. Restart the server after changing them.

# Network
server-port=25565
server-ip=
motd=&eA TheWello's Infdev server
max-players=20
upnp=true
online-mode=true
white-list=false

# World
level-name=world
level-seed=
view-distance=6
spawn-protection=0
# A world taken over from an older build keeps its old land as it is (false), or its chunks get the caves and ore blobs of inf-20100325-1640 (true)
upgrade-old-terrain=false

# Gameplay (difficulty, monsters and animals do not exist in inf-20100227-1433, inf-20100313, inf-20100316, inf-20100320, inf-20100321 and inf-20100325-1640)
pvp=true
difficulty=2
spawn-monsters=true
spawn-animals=true
mob-cap-monsters=100
mob-cap-animals=20

# Saving
autosave-minutes=5

# Game version this server runs (put the matching original jar in this folder):
#   inf-20100630-1340, inf-20100227-1433, inf-20100313, inf-20100316, inf-20100320, inf-20100321   or   inf-20100325-1640
game-version=inf-20100630-1340

# Game code jar (auto = the inf-*.jar in this folder that belongs to game-version)
game-jar=auto
