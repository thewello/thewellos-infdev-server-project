# TheWello's Infdev Server settings. Restart the server after changing them.

# Network
server-port=25565
server-ip=
motd=&eA TheWello's Infdev server
max-players=20
upnp=true
online-mode=true
white-list=false

# World
level-name=world
level-seed=
view-distance=6
spawn-protection=0

# Gameplay (difficulty, monsters and animals do not exist in inf-20100227-1433, inf-20100313, inf-20100316 and inf-20100320)
pvp=true
difficulty=2
spawn-monsters=true
spawn-animals=true
mob-cap-monsters=100
mob-cap-animals=20

# Saving
autosave-minutes=5

# Game version this server runs (put the matching original jar in this folder):
#   inf-20100630-1340, inf-20100227-1433, inf-20100313, inf-20100316   or   inf-20100320
game-version=inf-20100630-1340

# Game code jar (auto = the inf-*.jar in this folder that belongs to game-version)
game-jar=auto
